<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 物件操作練習</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; }
        .result-box { background-color: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        code { background: #eee; padding: 2px 5px; }
    </style>
</head>
<body>

    <h2>1. 原始物件的所有屬性：</h2>
    <div id="originalProperties" class="result-box"></div>

    <h2>2. 刪除 age 屬性後的物件：</h2>
    <div id="finalObject" class="result-box"></div>

    <script>
        // 1. 定義範例物件
        var Person = {
            firstName : "Tony",
            lastName : "Lee",
            age : 50,
            eyeColor : "Blue"
        };

        // 2. 列出所有屬性
        // 使用 Object.keys() 取得所有鍵名
        var properties = Object.keys(Person);
        document.getElementById('originalProperties').innerHTML = 
            "屬性列表: <code>" + properties.join(", ") + "</code>";

        // 3. 刪除 age 屬性
        delete Person.age;

        // 4. 印出刪除後的物件內容
        // 使用 JSON.stringify 將物件轉為字串顯示
        document.getElementById('finalObject').innerHTML = 
            "<pre>" + JSON.stringify(Person, null, 4) + "</pre>";

        // 同時在控制台印出結果
        console.log("刪除 age 後的物件:", Person);
    </script>
</body>
</html>
