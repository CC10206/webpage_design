<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table and Fixed Div</title>
  <style>
    * {
      font-family: 'Times New Roman', Times, serif;
    }

    body {
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 250px;
    }

    th {
      background-color: #808080;
      color: white;
      padding: 8px 16px;
      text-align: left;
      border: 1px solid #ccc;
    }

    tr:nth-child(odd) td {
      background-color: yellow;
    }

    tr:nth-child(even) td {
      background-color: white;
    }

    td {
      padding: 8px 16px;
      border: 1px solid #ccc;
    }

    .fixed-box {
      position: fixed;
      top: 20px;
      right: 20px;
      border: 2px solid green;
      padding: 10px;
      width: 150px;
      background-color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Firstname</th>
        <th>Lastname</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td>2</td>
        <td>2</td>
      </tr>
      <tr>
        <td>3</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>

  <div class="fixed-box">
    This div element has position: fixed;
  </div>

</body>
</html>
