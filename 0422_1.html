<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
  <style>
    .btn-spec {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      border-radius: 8px;
      padding: 0 10px;
      background: #ffffff;
      border: 1px solid #2f2f2f;
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: #2f2f2f;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="btn-spec">查看資訊</button>
</body>
</html>
