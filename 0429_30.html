<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Interaction</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .box {
      border: 1px solid #ccc;
      padding: 30px 40px;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    #myText {
      font-size: 2rem;
      color: black;
    }

    #myBtn {
      padding: 6px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <span id="myText">Hello</span>
    <button id="myBtn"
      onmouseover="handleMouseOver()"
      onmouseout="handleMouseOut()"
      onclick="handleClick()">Button</button>
  </div>

  <script>
    const text = document.getElementById('myText');

    function handleMouseOver() {
      text.textContent = 'Hello';
      text.style.color = 'magenta';
    }

    function handleMouseOut() {
      text.textContent = 'Hello';
      text.style.color = 'black';
    }

    function handleClick() {
      text.textContent = 'Mouse Click';
      text.style.color = 'magenta';
    }
  </script>
</body>
</html>
