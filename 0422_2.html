<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Image Styling Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #f5f0eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
    }
    .img-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .img-wrapper.side { width: 33%; }

    /* Left: no distortion */
    .img-left {
      width: 33%;
      height: 300px;
      border-radius: 18px;
      display: block;
      object-fit: cover;
    }

    /* Center: 150px circle */
    .img-center-wrapper {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid #b0a090;
      flex-shrink: 0;
      margin: 0 -12px;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.22);
    }
    .img-center-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Right: same size as left, but vertically stretched */
    .img-right-wrapper {
      width: 33%;
      height: 300px;
      overflow: hidden;
    }
    .img-right {
      width: 100%;
      height: 300px;
      display: block;
      object-fit: cover;
      transform: scaleY(1.6);
      transform-origin: center center;
    }

    .label {
      font-size: 0.7rem;
      color: #999;
      text-align: center;
      margin-top: 8px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="gallery">

    <!-- LEFT: no distortion -->
    <div class="img-wrapper side">
      <img
        class="img-left"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Eiffel_tower_from_below.jpg/427px-Eiffel_tower_from_below.jpg"
        onerror="this.onerror=null; this.src='https://picsum.photos/seed/eiffel-left/400/520';"
        alt="Eiffel Tower"
      />

    </div>

    <!-- CENTER: 150px circle -->
    <div class="img-wrapper">
      <div class="img-center-wrapper">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/640px-24701-nature-natural-beauty.jpg"
          onerror="this.onerror=null; this.src='https://picsum.photos/seed/river-valley/300/300';"
          alt="Nature scenery"
        />
      </div>
   
    </div>

    <!-- RIGHT: same size, vertical distortion -->
    <div class="img-wrapper side">
      <div class="img-right-wrapper">
        <img
          class="img-right"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Eiffel_tower_from_below.jpg/427px-Eiffel_tower_from_below.jpg"
          onerror="this.onerror=null; this.src='https://picsum.photos/seed/eiffel-right/400/520';"
          alt="Eiffel Tower distorted"
        />
      </div>

    </div>

  </div>
</body>
</html>
