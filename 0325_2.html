<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headings</title>
  <style>
    body {
      background-color: #fff;
      font-family: 'Times New Roman', Times, serif;
      padding: 30px;
    }

    /* Heading 1: bold, underline, left-aligned */
    h1 {
      font-size: 2rem;
      font-weight: bold;
      text-decoration: overline;
      text-align: left;
      border: none;
      margin-bottom: 16px;
      text-shadow: 3px 3px 0px rgba(255, 0, 0, 0.3);
    }

    /* Heading 2: italic, yellow border box, left-aligned */
    h2 {
      font-size: 1.5rem;
      font-style: italic;
      font-weight: bold;
      text-align: left;
      border: 2px solid #CCCC00;
      padding: 6px 10px;
      display: block;
      margin-bottom: 16px;
    }

    /* Heading 3: underline, right-aligned */
    h3 {
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: underline;
      text-align: right;
      border: none;
    }
  </style>
</head>
<body>
  <h1>This is heading 1</h1>
  <h2>This is heading 2</h2>
  <h3>This is heading 3</h3>
</body>
</html>
