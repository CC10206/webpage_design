<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0325</title>
  <style>
    body {
      background-color: #fff;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      padding: 14px 18px;
      margin-bottom: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #000;
      box-sizing: border-box;
    }

    /* Box 1: Light blue background, red solid border */
    .box1 {
      background-color: #ADD8E6;
      border: 4px solid #E05050;
    }

    /* Box 2: Yellow background, blue solid rounded border */
    .box2 {
      background-color: #FFFF00;
      border: 3px solid #1E90FF;
      border-radius: 8px;
    }

    /* Box 3: Green background, dark dotted border */
    .box3 {
      background-color: #3CB371;
      border: 4px dotted #2E6E4E;
    }

    .note {
      color: #E03030;
      font-style: italic;
      font-size: 1rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="box box1">Hello World</div>
  <div class="box box2">Hello World</div>
  <div class="box box3">Hello World</div>

  <p class="note">* Note colors, backgrounds and borders.</p>

</body>
</html>
